server.servlet.context-path=/
server.port=8080
# 绑定到所有网络接口，支持本机 IP 访问
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/timeline_app?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=Huawei@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=3000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.location=${java.io.tmpdir}
spring.servlet.multipart.file-size-threshold=0

# File Storage Configuration
app.storage.location=./storage

# JWT Configuration
app.jwt.secret=timeline-secret-key-very-long-and-secure-change-this-in-production
app.jwt.expiration=604800000

# CORS Configuration
# 支持 localhost 和本机 IP 访问（使用通配符匹配所有可能的本地 IP）
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:8080,http://192.168.*:*,http://10.*:*,http://172.*:*

# Logging
logging.level.com.huawei.codearts.timeline=DEBUG
logging.level.org.springframework.security=DEBUG
