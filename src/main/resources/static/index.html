<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发者工具市场</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            color: white;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .sidebar-header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .sidebar-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .category-nav {
            list-style: none;
        }

        .category-nav li {
            margin-bottom: 8px;
        }

        .category-nav button {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .category-nav button:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(4px);
        }

        .category-nav button.active {
            background: white;
            color: #667eea;
            font-weight: 600;
        }

        .category-count {
            background: rgba(255,255,255,0.3);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .category-nav button.active .category-count {
            background: #667eea;
            color: white;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 40px;
        }

        .content-header {
            margin-bottom: 30px;
        }

        .content-header h2 {
            font-size: 2rem;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .content-header p {
            color: #718096;
            font-size: 1rem;
        }

        /* 工具网格 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border-color: #667eea;
        }

        .tool-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .tool-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-right: 16px;
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .tool-title {
            flex: 1;
        }

        .tool-title h3 {
            font-size: 1.2rem;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .tool-description {
            color: #718096;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* 工具页面 */
        .tool-page {
            display: none;
        }

        .tool-page.show {
            display: block;
        }

        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: #5568d3;
            transform: translateX(-2px);
        }

        /* 工具工作区 */
        .tool-workspace {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .workspace-header {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .workspace-title h2 {
            font-size: 1.8rem;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .workspace-title p {
            color: #718096;
        }

        .tool-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }

        .radio-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 16px;
            background: #f7fafc;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .radio-item:hover {
            background: #e2e8f0;
        }

        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .help-text {
            font-size: 0.85rem;
            color: #718096;
            margin-top: 6px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .result-box {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-box h4 {
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .result-content {
            background: white;
            padding: 16px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            color: #2d3748;
            word-break: break-all;
            white-space: pre-wrap;
            min-height: 60px;
            max-height: 400px;
            overflow-y: auto;
        }

        .error {
            background: #fed7d7;
            border-color: #fc8181;
            color: #c53030;
        }

        .success {
            background: #c6f6d5;
            border-color: #68d391;
            color: #276749;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }

            .tools-grid {
                grid-template-columns: 1fr;
            }
        }

        .no-tools {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }

        .no-tools svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🛠️ 开发者工具市场</h1>
                <p>精选实用开发工具</p>
            </div>
            <ul class="category-nav" id="categoryNav">
                <!-- 分类导航将由 JS 生成 -->
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 工具列表页面 -->
            <div id="toolsListView">
                <div class="content-header">
                    <h2 id="categoryTitle">全部工具</h2>
                    <p id="categoryDesc">查看所有可用的开发工具</p>
                </div>
                <div class="tools-grid" id="toolsGrid">
                    <!-- 工具卡片将由 JS 生成 -->
                </div>
            </div>

            <!-- 工具详情页面 -->
            <div id="toolDetailView" class="tool-page">
                <button class="back-btn" onclick="goHome()">
                    ← 返回工具列表
                </button>
                <div class="tool-workspace">
                    <div class="workspace-header">
                        <div class="workspace-title">
                            <h2 id="workspaceTitle">工具名称</h2>
                            <p id="workspaceDesc"></p>
                        </div>
                    </div>
                    <div class="tool-form" id="toolForm">
                        <!-- 表单将由 JS 生成 -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/api/tools';
        let currentTool = null;
        let currentCategory = 'all';
        let allTools = [];

        // 加载工具列表
        document.addEventListener('DOMContentLoaded', loadTools);

        async function loadTools() {
            try {
                const response = await fetch(API_BASE);
                const data = await response.json();

                if (data.success) {
                    allTools = data.data;
                    renderCategories(allTools);
                    displayTools(allTools);
                } else {
                    console.error('Failed to load tools:', data.error);
                }
            } catch (error) {
                console.error('Error loading tools:', error);
            }
        }

        // 渲染分类导航
        function renderCategories(tools) {
            // 统计分类
            const categories = new Map();
            categories.set('all', { name: '全部工具', icon: '📦', count: tools.length });

            tools.forEach(tool => {
                const cat = tool.category;
                if (!categories.has(cat)) {
                    categories.set(cat, { name: cat, icon: getCategoryIcon(cat), count: 0 });
                }
                categories.get(cat).count++;
            });

            // 生成导航 HTML
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = Array.from(categories.entries()).map(([key, cat]) => `
                <li>
                    <button onclick="filterByCategory('${key}')" ${key === 'all' ? 'class="active"' : ''} data-category="${key}">
                        <span>${cat.icon} ${cat.name}</span>
                        <span class="category-count">${cat.count}</span>
                    </button>
                </li>
            `).join('');
        }

        // 获取分类图标
        function getCategoryIcon(category) {
            const icons = {
                '编码转换': '🔄',
                '数据处理': '📊',
                '图像生成': '🎨',
                '评估工具': '📈',
                '参考工具': '📖'
            };
            return icons[category] || '🔧';
        }

        // 按分类筛选
        function filterByCategory(category) {
            currentCategory = category;

            // 如果当前在工具详情页，先返回列表页
            const toolDetailView = document.getElementById('toolDetailView');
            if (toolDetailView.classList.contains('show')) {
                goHome();
            }

            // 更新导航激活状态
            document.querySelectorAll('.category-nav button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            });

            // 筛选并显示工具
            const filtered = category === 'all'
                ? allTools
                : allTools.filter(tool => tool.category === category);

            displayTools(filtered);

            // 更新标题
            const catInfo = category === 'all'
                ? { name: '全部工具', desc: '查看所有可用的开发工具' }
                : { name: category, desc: `共 ${filtered.length} 个${category}工具` };

            document.getElementById('categoryTitle').textContent = catInfo.name;
            document.getElementById('categoryDesc').textContent = catInfo.desc;
        }

        // 显示工具列表
        function displayTools(tools) {
            const grid = document.getElementById('toolsGrid');

            if (tools.length === 0) {
                grid.innerHTML = `
                    <div class="no-tools" style="grid-column: 1 / -1;">
                        <p>该分类下暂无工具</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = tools.map(tool => `
                <div class="tool-card" onclick="openTool('${tool.id}')">
                    <div class="tool-header">
                        <div class="tool-icon">${getCategoryIcon(tool.category)}</div>
                        <div class="tool-title">
                            <h3>${tool.name}</h3>
                        </div>
                    </div>
                    <p class="tool-description">${tool.description}</p>
                </div>
            `).join('');
        }

        // 打开工具
        async function openTool(toolId) {
            try {
                const response = await fetch(`${API_BASE}/${toolId}`);
                const data = await response.json();

                if (data.success) {
                    currentTool = data.data;
                    showToolPage(currentTool);
                } else {
                    alert('加载工具失败: ' + data.error);
                }
            } catch (error) {
                console.error('Error loading tool:', error);
                alert('加载工具时发生错误');
            }
        }

        // 显示工具页面
        function showToolPage(tool) {
            document.getElementById('workspaceTitle').textContent = tool.name;
            document.getElementById('workspaceDesc').textContent = tool.description;

            const form = document.getElementById('toolForm');
            form.innerHTML = generateForm(tool);

            // 切换到工具页面
            document.getElementById('toolsListView').style.display = 'none';
            document.getElementById('toolDetailView').classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 返回主页
        function goHome() {
            document.getElementById('toolDetailView').classList.remove('show');
            document.getElementById('toolsListView').style.display = 'block';
            currentTool = null;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 生成表单
        function generateForm(tool) {
            let formHtml = '';

            Object.values(tool.parameters || {}).forEach(param => {
                formHtml += `
                    <div class="form-group">
                        <label>${param.description || param.name}</label>
                `;

                if (param.name === 'operation') {
                    const desc = param.description || '';
                    if (desc.includes('encode') && desc.includes('decode') && !desc.includes('compress')) {
                        formHtml += `
                            <div class="radio-group">
                                <label class="radio-item">
                                    <input type="radio" name="${param.name}" value="encode" ${param.defaultValue === 'encode' ? 'checked' : ''}>
                                    编码
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="${param.name}" value="decode" ${param.defaultValue === 'decode' ? 'checked' : ''}>
                                    解码
                                </label>
                            </div>
                        `;
                    } else if (desc.includes('format') && desc.includes('compress')) {
                        formHtml += `
                            <div class="radio-group">
                                <label class="radio-item">
                                    <input type="radio" name="${param.name}" value="format" ${param.defaultValue === 'format' ? 'checked' : ''}>
                                    格式化
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="${param.name}" value="compress" ${param.defaultValue === 'compress' ? 'checked' : ''}>
                                    压缩
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="${param.name}" value="validate" ${param.defaultValue === 'validate' ? 'checked' : ''}>
                                    验证
                                </label>
                            </div>
                        `;
                    } else {
                        const matches = desc.match(/(\w+)\(([^)]+)\)/g) || [];
                        if (matches.length > 0) {
                            formHtml += '<div class="radio-group">';
                            const options = matches.map(m => {
                                const [, value, label] = m.match(/(\w+)\(([^)]+)\)/) || [];
                                return { value, label };
                            });
                            options.forEach((opt, idx) => {
                                const isDefault = param.defaultValue === opt.value || (idx === 0 && !param.defaultValue);
                                formHtml += `
                                    <label class="radio-item">
                                        <input type="radio" name="${param.name}" value="${opt.value}" ${isDefault ? 'checked' : ''}>
                                        ${opt.label}
                                    </label>
                                `;
                            });
                            formHtml += '</div>';
                        } else {
                            formHtml += `<input type="text" name="${param.name}" value="${param.defaultValue || ''}" placeholder="请输入...">`;
                        }
                    }
                } else if (param.name === 'variant') {
                    formHtml += `
                        <select name="${param.name}">
                            <option value="standard" ${param.defaultValue === 'standard' ? 'selected' : ''}>标准 Base64</option>
                            <option value="url" ${param.defaultValue === 'url' ? 'selected' : ''}>URL 安全编码</option>
                            <option value="mime" ${param.defaultValue === 'mime' ? 'selected' : ''}>MIME 编码</option>
                        </select>
                        <p class="help-text">选择 Base64 编码变体</p>
                    `;
                } else if (param.name === 'input' || param.name === 'text') {
                    formHtml += `
                        <textarea name="${param.name}" placeholder="请输入需要处理的内容..."></textarea>
                    `;
                } else if (param.name === 'errorCorrection') {
                    formHtml += `
                        <select name="${param.name}">
                            <option value="L" ${param.defaultValue === 'L' ? 'selected' : ''}>L (7% 纠错)</option>
                            <option value="M" ${param.defaultValue === 'M' ? 'selected' : ''}>M (15% 纠错)</option>
                            <option value="Q" ${param.defaultValue === 'Q' ? 'selected' : ''}>Q (25% 纠错)</option>
                            <option value="H" ${param.defaultValue === 'H' ? 'selected' : ''}>H (30% 纠错)</option>
                        </select>
                        <p class="help-text">选择纠错级别，数值越高可容错越多</p>
                    `;
                } else if (param.name === 'size') {
                    formHtml += `
                        <input type="number" name="${param.name}" value="${param.defaultValue || '300'}" min="100" max="1000" step="10">
                        <p class="help-text">二维码图片尺寸（像素）</p>
                    `;
                } else if (param.name === 'level' || param.name === 'age') {
                    formHtml += `
                        <input type="number" name="${param.name}" value="${param.defaultValue || ''}" ${param.name === 'level' ? 'min="13" max="22"' : 'min="20" max="60"'}>
                    `;
                } else if (param.name.startsWith('perf')) {
                    formHtml += `
                        <select name="${param.name}">
                            <option value="A" ${param.defaultValue === 'A' ? 'selected' : ''}>A (100分)</option>
                            <option value="B+" ${param.defaultValue === 'B+' ? 'selected' : ''}>B+ (80分)</option>
                            <option value="B" ${param.defaultValue === 'B' ? 'selected' : ''}>B (60分)</option>
                            <option value="C" ${param.defaultValue === 'C' ? 'selected' : ''}>C (0分)</option>
                            <option value="D" ${param.defaultValue === 'D' ? 'selected' : ''}>D (0分)</option>
                        </select>
                    `;
                } else if (param.name === 'teamPotential') {
                    formHtml += `
                        <select name="${param.name}">
                            <option value="100" ${param.defaultValue === '100' ? 'selected' : ''}>发展空间非常大 (100分)</option>
                            <option value="80" ${param.defaultValue === '80' ? 'selected' : ''}>发展空间较大 (80分)</option>
                            <option value="60" ${param.defaultValue === '60' ? 'selected' : ''}>发展空间一般 (60分)</option>
                            <option value="40" ${param.defaultValue === '40' ? 'selected' : ''}>发展空间较差 (40分)</option>
                        </select>
                    `;
                } else if (param.name === 'otherFactors') {
                    formHtml += `
                        <input type="number" name="${param.name}" value="${param.defaultValue || '60'}" min="0" max="100">
                        <p class="help-text">其它因素综合得分（荣誉、项目经验、协作能力等）</p>
                    `;
                } else if (param.name === 'range') {
                    formHtml += `
                        <select name="${param.name}">
                            <option value="all" ${param.defaultValue === 'all' ? 'selected' : ''}>全部字符 (0-127)</option>
                            <option value="control" ${param.defaultValue === 'control' ? 'selected' : ''}>控制字符 (0-31)</option>
                            <option value="printable" ${param.defaultValue === 'printable' ? 'selected' : ''}>可打印字符 (32-126)</option>
                            <option value="extended" ${param.defaultValue === 'extended' ? 'selected' : ''}>扩展字符 (128-255)</option>
                        </select>
                        <p class="help-text">选择要显示的字符范围</p>
                    `;
                } else {
                    formHtml += `
                        <input type="text" name="${param.name}" value="${param.defaultValue || ''}" placeholder="请输入...">
                    `;
                }

                formHtml += '</div>';
            });

            formHtml += `
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="executeTool()">执行</button>
                    <button class="btn btn-secondary" onclick="clearForm()">清空</button>
                </div>
                <div class="result-box" id="resultBox" style="display: none;">
                    <h4>执行结果</h4>
                    <div class="result-content" id="resultContent"></div>
                </div>
            `;

            return formHtml;
        }

        // 执行工具
        async function executeTool() {
            if (!currentTool) return;

            const form = document.getElementById('toolForm');
            const inputs = form.querySelectorAll('input, textarea, select');
            const params = {};

            inputs.forEach(input => {
                if (input.type === 'radio') {
                    if (input.checked) {
                        params[input.name] = input.value;
                    }
                } else {
                    params[input.name] = input.value;
                }
            });

            try {
                const response = await fetch(`${API_BASE}/${currentTool.id}/execute`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(params)
                });

                const data = await response.json();
                displayResult(data);
            } catch (error) {
                console.error('Error executing tool:', error);
                displayResult({
                    success: false,
                    error: '网络错误或服务器无响应'
                });
            }
        }

        // 显示结果
        function displayResult(result) {
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            resultBox.style.display = 'block';
            resultBox.className = 'result-box';

            if (result.success) {
                resultBox.classList.add('success');

                // 二维码图片
                if (result.data?.result && result.data.result.startsWith('data:image')) {
                    resultContent.innerHTML = `<img src="${result.data.result}" alt="QR Code" style="max-width: 100%; height: auto; display: block; margin: 0 auto;">`;

                    if (result.data.size || result.data.errorCorrection) {
                        const info = [];
                        if (result.data.size) info.push(`尺寸: ${result.data.size}x${result.data.size}`);
                        if (result.data.errorCorrection) info.push(`纠错: ${result.data.errorCorrection}`);
                        if (info.length > 0) {
                            resultContent.innerHTML += `<p style="text-align: center; margin-top: 10px; color: #666; font-size: 0.9rem;">${info.join(' | ')}</p>`;
                        }
                    }
                }
                // ASCII 表格
                else if (result.data?.asciiData) {
                    const asciiData = result.data.asciiData;

                    resultContent.innerHTML = `
                        <div style="overflow-x: auto;">
                            <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                                <thead>
                                    <tr style="background: #667eea; color: white;">
                                        <th style="padding: 12px; text-align: center; border: 1px solid #5568d3;">DEC</th>
                                        <th style="padding: 12px; text-align: center; border: 1px solid #5568d3;">HEX</th>
                                        <th style="padding: 12px; text-align: center; border: 1px solid #5568d3;">OCT</th>
                                        <th style="padding: 12px; text-align: center; border: 1px solid #5568d3;">字符</th>
                                        <th style="padding: 12px; text-align: center; border: 1px solid #5568d3;">类型</th>
                                        <th style="padding: 12px; text-align: center; border: 1px solid #5568d3;">转义</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${asciiData.map((item, idx) => `
                                        <tr style="${idx % 2 === 0 ? 'background: #f7fafc;' : 'background: white;'}">
                                            <td style="padding: 8px; text-align: center; border: 1px solid #e2e8f0; font-family: monospace; font-weight: bold;">${item.dec}</td>
                                            <td style="padding: 8px; text-align: center; border: 1px solid #e2e8f0; font-family: monospace; color: #667eea;">${item.hex}</td>
                                            <td style="padding: 8px; text-align: center; border: 1px solid #e2e8f0; font-family: monospace; color: #764ba2;">${item.oct}</td>
                                            <td style="padding: 8px; text-align: center; border: 1px solid #e2e8f0; font-family: monospace; font-size: 1.1rem; ${item.type === '控制字符' || item.type === '删除' ? 'color: #f56565;' : ''}">${item.char}</td>
                                            <td style="padding: 8px; text-align: center; border: 1px solid #e2e8f0; font-size: 0.85rem; color: #718096;">${item.type}</td>
                                            <td style="padding: 8px; text-align: center; border: 1px solid #e2e8f0; font-size: 0.85rem; color: #48bb78;">${item.escape || '-'}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                            <p style="text-align: center; margin-top: 15px; color: #666; font-size: 0.9rem;">
                                共 ${result.data.total} 个字符
                            </p>
                        </div>
                    `;
                }
                // 续签评估
                else if (result.data?.details && result.data.details['续签评估']) {
                    const details = result.data.details;
                    const score = details['总分'];
                    const renewal = details['续签评估'];
                    const color = details['颜色标识'];

                    let colorClass = '';
                    if (color === 'green') colorClass = '#48bb78';
                    else if (color === 'blue') colorClass = '#4299e1';
                    else if (color === 'orange') colorClass = '#ed8936';
                    else if (color === 'red') colorClass = '#f56565';

                    resultContent.innerHTML = `
                        <div style="text-align: center; padding: 20px;">
                            <div style="font-size: 3rem; font-weight: bold; color: ${colorClass}; margin-bottom: 10px;">${score}</div>
                            <div style="font-size: 1.5rem; color: ${colorClass}; margin-bottom: 20px; font-weight: 600;">${renewal}</div>
                            <div style="text-align: left; background: #f7fafc; padding: 15px; border-radius: 8px; margin-top: 20px;">
                                <div style="margin-bottom: 10px;"><strong>职级:</strong> ${details['职级']}级 | <strong>年龄:</strong> ${details['年龄']}岁 | <strong>职级年龄得分:</strong> ${details['职级年龄得分']}</div>
                                <div style="margin-bottom: 10px;"><strong>绩效评估得分:</strong> ${details['绩效评估得分']}</div>
                                <div style="margin-left: 20px; font-size: 0.9rem; color: #666;">
                                    2022: ${details['2022绩效']} | 2023: ${details['2023绩效']} | 2024: ${details['2024绩效']} | 2025: ${details['2025绩效']}
                                </div>
                                <div style="margin-top: 10px;"><strong>团队业务发展潜力:</strong> ${details['团队业务发展潜力得分']} | <strong>其它因素:</strong> ${details['其它因素得分']}</div>
                            </div>
                            <div style="text-align: left; background: #fffaf0; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 4px solid #ed8936;">
                                <strong>建议:</strong> ${details['建议']}
                            </div>
                        </div>
                    `;
                } else {
                    resultContent.textContent = result.data?.result || '操作成功';
                }
            } else {
                resultBox.classList.add('error');
                resultContent.textContent = result.error || '操作失败';
            }
        }

        // 清空表单
        function clearForm() {
            const form = document.getElementById('toolForm');
            const inputs = form.querySelectorAll('input, textarea, select');

            inputs.forEach(input => {
                if (input.type === 'radio') {
                    const name = input.name;
                    const firstRadio = form.querySelector(`input[name="${name}"]`);
                    if (firstRadio) {
                        firstRadio.checked = true;
                    }
                } else {
                    input.value = '';
                }
            });

            document.getElementById('resultBox').style.display = 'none';
        }
    </script>
</body>
</html>
