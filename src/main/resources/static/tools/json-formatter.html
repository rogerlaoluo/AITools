<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化工具 - 开发者工具市场</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🛠️ 开发者工具市场</h1>
                <p>精选实用开发工具</p>
            </div>
            <ul class="category-nav">
                <li><a href="../index.html" style="color: white; text-decoration: none; display: block; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 8px;">← 返回首页</a></li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <a href="../index.html" class="back-btn">
                ← 返回工具市场
            </a>

            <div class="tool-workspace">
                <div class="workspace-header">
                    <div class="workspace-title">
                        <h2>JSON 格式化工具</h2>
                        <p>支持 JSON 格式化美化、压缩和语法验证</p>
                    </div>
                </div>

                <div class="tool-form" id="toolForm">
                    <div class="form-group">
                        <label>操作类型</label>
                        <div class="radio-group">
                            <label class="radio-item">
                                <input type="radio" name="operation" value="format" checked>
                                格式化
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="operation" value="compress">
                                压缩
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="operation" value="validate">
                                验证
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>输入 JSON</label>
                        <textarea name="input" placeholder='请输入 JSON 内容，例如：{"name": "value"}'></textarea>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="runTool()">执行</button>
                        <button class="btn btn-secondary" onclick="clearForm()">清空</button>
                    </div>

                    <div class="result-box" id="resultBox" style="display: none;">
                        <h4>执行结果</h4>
                        <div class="result-content" id="resultContent"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script>
        const TOOL_ID = 'json-formatter';

        async function runTool() {
            const params = getToolParams('toolForm');
            const result = await executeTool(TOOL_ID, params);
            displayResult(result);
        }
    </script>
</body>
</html>
