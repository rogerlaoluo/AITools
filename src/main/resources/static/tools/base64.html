<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 编解码工具 - 开发者工具市场</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🛠️ 开发者工具市场</h1>
                <p>精选实用开发工具</p>
            </div>
            <ul class="category-nav">
                <li><a href="../index.html" style="color: white; text-decoration: none; display: block; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 8px;">← 返回首页</a></li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <a href="../index.html" class="back-btn">
                ← 返回工具市场
            </a>

            <div class="tool-workspace">
                <div class="workspace-header">
                    <div class="workspace-title">
                        <h2>Base64 编解码工具</h2>
                        <p>支持Base64编码和解码，支持文本和URL安全编码</p>
                    </div>
                </div>

                <div class="tool-form" id="toolForm">
                    <div class="form-group">
                        <label>操作类型</label>
                        <div class="radio-group">
                            <label class="radio-item">
                                <input type="radio" name="operation" value="encode" checked>
                                编码
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="operation" value="decode">
                                解码
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>输入内容</label>
                        <textarea name="input" placeholder="请输入需要处理的内容..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>编码变体</label>
                        <select name="variant">
                            <option value="standard" selected>标准 Base64</option>
                            <option value="url">URL 安全编码</option>
                            <option value="mime">MIME 编码</option>
                        </select>
                        <p class="help-text">选择 Base64 编码变体</p>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="runTool()">执行</button>
                        <button class="btn btn-secondary" onclick="clearForm()">清空</button>
                    </div>

                    <div class="result-box" id="resultBox" style="display: none;">
                        <h4>执行结果</h4>
                        <div class="result-content" id="resultContent"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script>
        const TOOL_ID = 'base64';

        async function runTool() {
            const params = getToolParams('toolForm');
            const result = await executeTool(TOOL_ID, params);
            displayResult(result);
        }
    </script>
</body>
</html>
