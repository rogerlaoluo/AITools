<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进制转换工具 - 开发者工具市场</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🛠️ 开发者工具市场</h1>
                <p>精选实用开发工具</p>
            </div>
            <ul class="category-nav">
                <li><a href="../index.html" style="color: white; text-decoration: none; display: block; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 8px;">← 返回首页</a></li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <a href="../index.html" class="back-btn">
                ← 返回工具市场
            </a>

            <div class="tool-workspace">
                <div class="workspace-header">
                    <div class="workspace-title">
                        <h2>进制转换工具</h2>
                        <p>支持二进制、八进制、十进制、十六进制之间的相互转换</p>
                    </div>
                </div>

                <div class="tool-form" id="toolForm">
                    <div class="form-group">
                        <label>源进制</label>
                        <select name="fromBase" id="fromBase">
                            <option value="bin">二进制 (BIN)</option>
                            <option value="oct">八进制 (OCT)</option>
                            <option value="dec" selected>十进制 (DEC)</option>
                            <option value="hex">十六进制 (HEX)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>目标进制</label>
                        <select name="toBase" id="toBase">
                            <option value="bin">二进制 (BIN)</option>
                            <option value="oct">八进制 (OCT)</option>
                            <option value="dec">十进制 (DEC)</option>
                            <option value="hex" selected>十六进制 (HEX)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>输入数字</label>
                        <input type="text" name="input" id="inputNumber" placeholder="请输入需要转换的数字..." oninput="autoConvert()">
                        <p class="help-text" id="formatHint">输入十进制数字</p>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="runTool()">转换</button>
                        <button class="btn btn-secondary" onclick="clearForm()">清空</button>
                        <button class="btn btn-info" onclick="swapBases()">交换进制</button>
                    </div>

                    <div class="result-box" id="resultBox" style="display: none;">
                        <h4>转换结果</h4>
                        <div class="result-content" id="resultContent"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script>
        const TOOL_ID = 'number-converter';
        const baseHints = {
            'bin': '输入二进制数字（仅包含 0 和 1）',
            'oct': '输入八进制数字（0-7）',
            'dec': '输入十进制数字（0-9）',
            'hex': '输入十六进制数字（0-9, A-F）'
        };

        // 更新输入提示
        function updateHint() {
            const fromBase = document.getElementById('fromBase').value;
            document.getElementById('formatHint').textContent = baseHints[fromBase];
        }

        // 监听进制选择变化
        document.getElementById('fromBase').addEventListener('change', updateHint);
        document.getElementById('toBase').addEventListener('change', updateHint);

        // 交换源进制和目标进制
        function swapBases() {
            const fromBase = document.getElementById('fromBase');
            const toBase = document.getElementById('toBase');
            const temp = fromBase.value;
            fromBase.value = toBase.value;
            toBase.value = temp;
            updateHint();

            // 如果有结果，将结果作为新输入
            const resultElement = document.getElementById('conversionResult');
            if (resultElement) {
                document.getElementById('inputNumber').value = resultElement.textContent;
                runTool();
            }
        }

        // 自动转换（实时）
        let debounceTimer;
        function autoConvert() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                const input = document.getElementById('inputNumber').value.trim();
                if (input) {
                    runTool();
                }
            }, 300);
        }

        async function runTool() {
            const params = getToolParams('toolForm');
            if (!params.input || params.input.trim() === '') {
                return;
            }
            const result = await executeTool(TOOL_ID, params);
            displayNumberConverterResult(result);
        }

        function displayNumberConverterResult(result) {
            const resultBox = document.getElementById('resultBox');
            const resultContent = document.getElementById('resultContent');

            if (!resultBox || !resultContent) {
                console.error('Result elements not found');
                return;
            }

            resultBox.style.display = 'block';
            resultBox.className = 'result-box';

            if (result.success) {
                resultBox.classList.add('success');
                const data = result.data;

                resultContent.innerHTML = `
                    <div style="margin-bottom: 20px;">
                        <div style="font-size: 0.9rem; color: #666; margin-bottom: 5px;">
                            ${getBaseName(data.fromBase)} → ${getBaseName(data.toBase)}
                        </div>
                        <div style="font-size: 1.5rem; font-weight: bold; color: #667eea; font-family: monospace; word-break: break-all;" id="conversionResult">
                            ${data.result}
                        </div>
                    </div>
                    <div style="border-top: 1px solid #e2e8f0; padding-top: 15px;">
                        <h5 style="margin-bottom: 10px; color: #4a5568;">所有进制表示</h5>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem;">
                            <div style="background: #f7fafc; padding: 10px; border-radius: 6px;">
                                <div style="color: #718096; margin-bottom: 3px;">二进制 (BIN)</div>
                                <div style="font-family: monospace; font-weight: 600; word-break: break-all;">${data.binary}</div>
                            </div>
                            <div style="background: #f7fafc; padding: 10px; border-radius: 6px;">
                                <div style="color: #718096; margin-bottom: 3px;">八进制 (OCT)</div>
                                <div style="font-family: monospace; font-weight: 600; word-break: break-all;">${data.octal}</div>
                            </div>
                            <div style="background: #f7fafc; padding: 10px; border-radius: 6px;">
                                <div style="color: #718096; margin-bottom: 3px;">十进制 (DEC)</div>
                                <div style="font-family: monospace; font-weight: 600; word-break: break-all;">${data.decimal}</div>
                            </div>
                            <div style="background: #f7fafc; padding: 10px; border-radius: 6px;">
                                <div style="color: #718096; margin-bottom: 3px;">十六进制 (HEX)</div>
                                <div style="font-family: monospace; font-weight: 600; word-break: break-all;">${data.hexadecimal}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                resultBox.classList.add('error');
                resultContent.textContent = result.error || '转换失败';
            }
        }

        function getBaseName(base) {
            const names = {
                'bin': '二进制',
                'oct': '八进制',
                'dec': '十进制',
                'hex': '十六进制'
            };
            return names[base] || base;
        }

        // 初始化提示
        updateHint();
    </script>
</body>
</html>
