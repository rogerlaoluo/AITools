<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线加密解密 - 开发者工具市场</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🛠️ 开发者工具市场</h1>
                <p>精选实用开发工具</p>
            </div>
            <ul class="category-nav">
                <li><a href="../index.html" style="color: white; text-decoration: none; display: block; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 8px;">← 返回首页</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <a href="../index.html" class="back-btn">← 返回工具市场</a>
            <div class="tool-workspace">
                <div class="workspace-header">
                    <div class="workspace-title">
                        <h2>在线加密解密</h2>
                        <p>支持 AES、DES、MD5、SHA-256、SHA-512 等多种加密解密算法</p>
                    </div>
                </div>
                <div class="tool-form" id="toolForm">
                    <div class="form-group">
                        <label>算法</label>
                        <select name="algorithm">
                            <option value="AES" selected>AES 加密/解密</option>
                            <option value="DES">DES 加密/解密</option>
                            <option value="MD5">MD5 哈希</option>
                            <option value="SHA-256">SHA-256 哈希</option>
                            <option value="SHA-512">SHA-512 哈希</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>操作类型</label>
                        <div class="radio-group">
                            <label class="radio-item">
                                <input type="radio" name="operation" value="encrypt" checked>
                                加密
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="operation" value="decrypt">
                                解密
                            </label>
                        </div>
                        <p class="help-text">注意：哈希算法（MD5、SHA）仅支持加密操作</p>
                    </div>

                    <div class="form-group">
                        <label>输入内容</label>
                        <textarea name="input" placeholder="请输入需要加密或解密的内容..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>密钥</label>
                        <input type="text" name="key" placeholder="可选，留空则自动生成密钥">
                        <p class="help-text">AES/DES 加密解密时使用，解密时必须提供相同的密钥</p>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="runTool()">执行</button>
                        <button class="btn btn-secondary" onclick="clearForm()">清空</button>
                    </div>

                    <div class="result-box" id="resultBox" style="display: none;">
                        <h4>执行结果</h4>
                        <div class="result-content" id="resultContent"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/common.js"></script>
    <script>
        const TOOL_ID = 'encryption-tool';

        async function runTool() {
            const params = getToolParams('toolForm');
            const result = await executeTool(TOOL_ID, params);
            displayResult(result);
        }
    </script>
</body>
</html>
