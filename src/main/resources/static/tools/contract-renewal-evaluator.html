<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>续签评估系统 - 开发者工具市场</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🛠️ 开发者工具市场</h1>
                <p>精选实用开发工具</p>
            </div>
            <ul class="category-nav">
                <li><a href="../index.html" style="color: white; text-decoration: none; display: block; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 8px;">← 返回首页</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <a href="../index.html" class="back-btn">← 返回工具市场</a>

            <div class="tool-workspace">
                <div class="workspace-header">
                    <div class="workspace-title">
                        <h2>续签评估系统</h2>
                        <p>根据职级、年龄、绩效、团队业务潜力等因素评估员工续签可能性</p>
                    </div>
                </div>

                <div class="tool-form" id="toolForm">
                    <div class="form-group">
                        <label>职级</label>
                        <input type="number" name="level" value="15" min="13" max="22">
                    </div>

                    <div class="form-group">
                        <label>年龄</label>
                        <input type="number" name="age" value="30" min="20" max="60">
                    </div>

                    <div class="form-group">
                        <label>2022年绩效</label>
                        <select name="perf2022">
                            <option value="A">A (100分)</option>
                            <option value="B+" selected>B+ (80分)</option>
                            <option value="B">B (60分)</option>
                            <option value="C">C (0分)</option>
                            <option value="D">D (0分)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>2023年绩效</label>
                        <select name="perf2023">
                            <option value="A">A (100分)</option>
                            <option value="B+" selected>B+ (80分)</option>
                            <option value="B">B (60分)</option>
                            <option value="C">C (0分)</option>
                            <option value="D">D (0分)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>2024年绩效</label>
                        <select name="perf2024">
                            <option value="A">A (100分)</option>
                            <option value="B+" selected>B+ (80分)</option>
                            <option value="B">B (60分)</option>
                            <option value="C">C (0分)</option>
                            <option value="D">D (0分)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>2025年绩效</label>
                        <select name="perf2025">
                            <option value="A">A (100分)</option>
                            <option value="B+" selected>B+ (80分)</option>
                            <option value="B">B (60分)</option>
                            <option value="C">C (0分)</option>
                            <option value="D">D (0分)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>团队业务发展潜力</label>
                        <select name="teamPotential">
                            <option value="100">发展空间非常大 (100分)</option>
                            <option value="80">发展空间较大 (80分)</option>
                            <option value="60" selected>发展空间一般 (60分)</option>
                            <option value="40">发展空间较差 (40分)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>其它因素得分</label>
                        <input type="number" name="otherFactors" value="60" min="0" max="100">
                        <p class="help-text">其它因素综合得分（荣誉、项目经验、协作能力等）</p>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="runTool()">开始评估</button>
                        <button class="btn btn-secondary" onclick="clearForm()">清空</button>
                    </div>

                    <div class="result-box" id="resultBox" style="display: none;">
                        <h4>评估结果</h4>
                        <div class="result-content" id="resultContent"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script>
        const TOOL_ID = 'contract-renewal-evaluator';

        async function runTool() {
            const params = getToolParams('toolForm');
            const result = await executeTool(TOOL_ID, params);
            displayResult(result);
        }
    </script>
</body>
</html>
